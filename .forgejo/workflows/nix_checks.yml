# Everything nix: is the flake well-formed, and does every box still build.
# Called from entry_point.yml; not triggered on its own. Builds land in the
# runner box's own store and in the nix-cache bucket, so a green build_host
# is a deployable closure any box can fetch.
name: nix_checks

on:
  workflow_call:
    inputs:
      run:
        description: "false: report every job as skipped"
        type: boolean
        default: true
      vm:
        description: "boot the boxes as vms and drive the failure cases"
        type: boolean
        default: false

jobs:
  flake_check:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      # evaluate everything, build nothing: the vm tests are built by their
      # own jobs, only when what a box runs changed
      - name: flake check
        run: nix flake check --no-build --show-trace
      # the checks that are plain evaluation, no vm: seconds
      - name: placement and box list
        run: nix build --no-link .#checks.x86_64-linux.placement .#checks.x86_64-linux.boxes

  # The programs every box and every vm test carry. Built once, first, and
  # uploaded to the bucket; the jobs below then download them instead of
  # each compiling the same rust workspace again on whichever box it lands.
  build_client:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: build dd, verify, agent, web
        run: nix build --no-link .#dd .#verify .#agent .#web

  build_host:
    if: ${{ inputs.run }}
    needs: build_client
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: [node1, node2]
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: build ${{ matrix.host }}
        run: nix build --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  # one job per test, so they spread over every runner box and run at once
  vm_tests:
    if: ${{ inputs.run && inputs.vm }}
    needs: build_client
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        test: [directory, metrics, backup, release, thanos, members-runner, games, forge]
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: ${{ matrix.test }}
        run: nix build --no-link .#checks.x86_64-linux.${{ matrix.test }}
