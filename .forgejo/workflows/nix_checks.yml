# Everything nix: is the flake well-formed, and does every box still build.
# Called from entry_point.yml; not triggered on its own. Builds happen in
# node1's own store, so a green build_host (node1) is a deployable closure.
name: nix_checks

on:
  workflow_call:
    inputs:
      run:
        description: "false: report every job as skipped"
        type: boolean
        default: true
      vm:
        description: "boot the boxes as vms and drive the failure cases"
        type: boolean
        default: false

jobs:
  flake_check:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      # evaluate everything, build nothing: the vm tests are built by their
      # own job, only when what a box runs changed
      - name: flake check
        run: nix flake check --no-build --show-trace

  build_host:
    if: ${{ inputs.run }}
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: [node1, node2]
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: build ${{ matrix.host }}
        run: nix build --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  vm_tests:
    if: ${{ inputs.run && inputs.vm }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: boxes as vms
        run: nix build --no-link .#checks.x86_64-linux.placement .#checks.x86_64-linux.metrics .#checks.x86_64-linux.directory
