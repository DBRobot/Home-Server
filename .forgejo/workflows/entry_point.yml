# The entry point, for the forge on node1. Jobs run on a box with nix
# already present, so nothing is installed and every build lands in the
# box's own store. Every job here gates a merge or feeds the cache, so
# every job will ask for a gating runner, a box the release signer owns,
# once the runners carry that label (the release after this lands).
# files_modified decides what changed; the leaves run only for the parts
# that did.
name: entry_point

# once per change: a pull request runs it, and main is only ever a
# fast-forward of a branch it already ran on, so a push to main runs nothing
on:
  pull_request:

jobs:
  files_modified:
    runs-on: nix
    outputs:
      nix: ${{ steps.detect.outputs.nix }}
      rust: ${{ steps.detect.outputs.rust }}
      vm: ${{ steps.detect.outputs.vm }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0 # the diff against the base needs history

      # Allowlists, not denylists: a new directory should not silently cost
      # a system build until someone remembers to exclude it. A wrong list
      # here is caught by the boxes, which build the whole system from main
      # at every release and roll back what does not come up.
      - name: what changed?
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          nix=false; rust=false; vm=false
          # the client is built by the flake too, so a rust change is a nix change
          echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|hosts/|modules/|roles/|fleet/|secrets/|client/|\.forgejo/workflows/)' && nix=true
          echo "$changed" | grep -qE '^(client/|\.forgejo/workflows/)' && rust=true
          # boxes booted as vms: only when what a box runs changed, not for
          # every client or host tweak. Minutes, so spent where it counts.
          echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|modules/|roles/|fleet/|hosts/|tests/|client/crates/(verify|identity)/|\.forgejo/workflows/)' && vm=true
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"
          echo "nix: $nix  rust: $rust  vm: $vm"

  # Always called; each leaf skips itself when nothing relevant changed. A
  # skipped leaf still reports, which a required check needs - a skipped
  # caller would leave the leaves unreported and the merge blocked forever.
  nix_checks:
    needs: files_modified
    uses: ./.forgejo/workflows/nix_checks.yml
    with:
      run: ${{ needs.files_modified.outputs.nix == 'true' }}
      vm: ${{ needs.files_modified.outputs.vm == 'true' }}

  rust_checks:
    needs: files_modified
    uses: ./.forgejo/workflows/rust_checks.yml
    with:
      run: ${{ needs.files_modified.outputs.rust == 'true' }}
