[package]
name = "git-remote-dd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "git-remote-dd"
path = "src/main.rs"

[dependencies]
auth = { path = "../auth" }
identity = { path = "../identity" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
sha2 = "0.10"
# the repository key encrypts every pack: xchacha20-poly1305, a random
# 24-byte nonce per pack, the whole pack as one message
chacha20poly1305 = "0.10"
# the repository key is sealed to each collaborator's device key. Device
# keys are ed25519; the same key pair, mapped to x25519, receives a sealed
# box. One key for both is a documented trade (eprint 2021/509); the
# alternative was a second key per device to publish, back up and lose.
crypto_box = { version = "0.9", features = ["seal", "std"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
biscuit-auth = "6"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
