[package]
name = "library"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A member's encrypted library: files in chunks a box can hold but not read, keys that live in the directory"

[dependencies]
identity = { path = "../identity" }
# rclone's crypt format (crypt.rs): scrypt keys, AES-EME names, secretbox blocks
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
eme-mode = { version = "0.3", features = ["block-padding", "alloc"] }
crypto_secretbox = "0.1"
base32 = "0.5"
getrandom = "0.2"
crypto_box = { version = "0.9", features = ["seal"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
