[package]
name = "archive"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The encrypted, deduplicated repository format - restic's, via its Rust
# implementation. Nothing cryptographic is ours: this crate only supplies the
# place the repository lives (webdav behind kanidm) and the token that gets
# it there.
rustic_core = "0.13"
auth = { path = "../auth" }
# blocking: rustic_core's backend trait is synchronous, and every call into it
# happens on rustic's own worker threads, never on an async executor.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
# a private current-thread runtime, only to drive auth::refresh from the
# synchronous backend
tokio = { version = "1", features = ["rt"] }
url = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
anyhow = "1"
