[package]
name = "ente"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# rustls rather than the default native-tls: no system openssl to link against,
# and it is the TLS stack that survives compiling to wasm later.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
