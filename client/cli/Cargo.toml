[package]
name = "dd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ente = { path = "../ente" }
auth = { path = "../auth" }
identity = { path = "../identity" }
directory = { path = "../directory" }
library = { path = "../library" }
fuser = "0.18"
libc = "0.2"
release = { path = "../../box/release" }
ed25519-dalek = "2"
biscuit-auth = "6"
# the device key written as an OpenSSH key, so git signs commits with it
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
# an age identity for editing the repo's sops files, kept in the keyring
age = { version = "0.11", default-features = false }
secrecy = "0.10"
archive = { path = "../../box/archive" }
# already in the tree through ente; used to derive the archive password
hkdf = "0.12"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
anyhow = "1"
rpassword = "7"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# `dd signup` talks to the signup service; the same crate auth already uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
# the boxes the end-to-end tests run in-process
verify = { path = "../../box/verify" }
# the browser, headless: a software passkey that answers the box's
# webauthn ceremonies, so enrolment and login are tested without a person
webauthn-rs = "0.6.1-dev"
webauthn-authenticator-rs = { version = "0.6.1-dev", features = ["softpasskey"] }
