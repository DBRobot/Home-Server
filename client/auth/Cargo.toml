[package]
name = "auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zeroize = "1"
thiserror = "2"
# The user-held key. A device signs its own short-lived tokens with an ed25519
# key that never leaves the keyring; services verify against the public half.
# Biscuit is the token format: public-key verification, offline, attenuable.
biscuit-auth = "6"
base64 = "0.22"
serde_json = "1"

# The OS credential store: secret service on linux, keychain on macos,
# credential manager on windows. Nothing bespoke, no crypto of ours. Android
# has none of these; there the app keeps a file in its private storage
# (FileStore), which the system keeps from other apps.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"
