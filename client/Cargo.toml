# A workspace: several crates built together, sharing one Cargo.lock and one
# target/ directory. Same bargain as flake.lock - loose requirements here,
# exact versions pinned in the lock file.
[workspace]
resolver = "3"
members = ["crates/ente", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
