[package]
name = "identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ed25519 over canonical json: the person's root key signs their own entry.
# already in the tree through biscuit.
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
sha2 = "0.10"
# a root that is a browser passkey: the entry is signed by a webauthn
# assertion whose challenge is the entry's hash. The cose key types and
# their signature check; no ceremony code
webauthn-rs-core = "0.6.1-dev"
