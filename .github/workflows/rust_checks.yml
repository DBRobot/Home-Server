# Everything in client/: formatted, lint-clean, and the tests pass - the
# end-to-end ones included, which run boxes in-process and try to break them.
# Called from entry_point.yml; not triggered on its own.
name: rust_checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test
