name: nix_builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nix_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: assert we actually joined the tailnet
        run: |
          # the action can report success without authenticating, which
          # then looks like an unreachable cache rather than a failed login
          STATE=$(tailscale status --json | jq -r .BackendState)
          echo "backend state: $STATE"
          if [ "$STATE" != "Running" ]; then
            echo "::error::tailscale did not authenticate (state=$STATE)."
            echo "The OAuth client probably cannot mint tagged auth keys."
            tailscale status || true
            exit 1
          fi
          tailscale status

      - name: use node1 as a binary cache
        run: |
          sudo tee -a /etc/nix/nix.conf >/dev/null <<'CONF'
          extra-substituters = http://100.95.31.105:5000
          extra-trusted-public-keys = node1.tail92cae0.ts.net-1:0y9M/Gk1pKTr/cBuaW1tJU10NYVRnWjzNeCNJC8mBQg=
          CONF
          sudo systemctl restart nix-daemon 2>/dev/null || true
          # tailnet IP, not MagicDNS: runners do not get DNS from the tailnet
          curl -sf --max-time 20 http://100.95.31.105:5000/nix-cache-info

      - name: flake check
        run: nix flake check --show-trace

      - name: build node1
        run: nix build .#nixosConfigurations.node1.config.system.build.toplevel
