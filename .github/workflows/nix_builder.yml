name: nix_builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nix_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff against the base

      # A docs-only PR cannot change the system closure, but the job still has
      # to run and report: main requires nix_check, so skipping the whole
      # workflow with paths-ignore would leave the check pending forever.
      - name: does anything nix-relevant change?
        id: relevant
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"   # always build main
            exit 0
          fi
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # client/** is rust: it cannot change the system closure, so it
          # skips the nixos build and is covered by the rust job instead.
          if echo "$changed" | grep -qvE '^(LICENSE|.*\.md|.*\.txt|client/.*)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "docs only - skipping the build"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.relevant.outputs.build == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: flake check
        if: steps.relevant.outputs.build == 'true'
        run: nix flake check --show-trace

      - name: build node1
        if: steps.relevant.outputs.build == 'true'
        run: nix build .#nixosConfigurations.node1.config.system.build.toplevel

  rust_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: does any rust change?
        id: relevant
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD \
             | grep -qE '^client/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.relevant.outputs.run == 'true'
        with:
          components: clippy, rustfmt

      - name: fmt
        if: steps.relevant.outputs.run == 'true'
        working-directory: client
        run: cargo fmt --check

      - name: clippy
        if: steps.relevant.outputs.run == 'true'
        working-directory: client
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        if: steps.relevant.outputs.run == 'true'
        working-directory: client
        run: cargo test
