{# who is signed in, and everything that is not a service: the name is
   the control, so there is no second thing in the bar to explain #}
<div class="me">
  <details class="menu">
    <summary>
      <span class="avatar" aria-hidden="true">{{ initial }}</span>
      <span>{{ user }}</span>
      <span class="chev" aria-hidden="true"></span>
    </summary>
    <nav>
      {% for g in menu.groups %}{% if !loop.first %}<hr>{% endif %}
      {% for i in g %}<a href="{{ i.url }}">{{ i.label }}</a>{% endfor %}
      {% endfor %}
    </nav>
  </details>
</div>
