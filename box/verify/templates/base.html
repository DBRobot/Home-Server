<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Commonty{% endblock %}</title>
  <link rel="stylesheet" href="/_dd/static/home.css">
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/" aria-label="Commonty">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="20" height="7" rx="2.5" fill="rgba(255,255,255,.22)" stroke="currentColor" stroke-width="1.8"/>
          <rect x="3" y="15" width="20" height="7" rx="2.5" fill="rgba(255,255,255,.22)" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/>
          <circle cx="7.5" cy="18.5" r="1.3" fill="currentColor"/>
        </svg>
        Commonty
      </a>
      {% block bar %}{% endblock %}
    </div>
  </header>
  {% block main %}{% endblock %}
</body>
</html>
