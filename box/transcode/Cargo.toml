[package]
name = "transcode"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "One file, one viewer, one job: decrypt in memory, transcode, stream, forget"

[[bin]]
name = "dd-transcode"
path = "src/main.rs"

[dependencies]
library = { path = "../../client/library" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zeroize = "1"
futures = "0.3"
bytes = "1"
