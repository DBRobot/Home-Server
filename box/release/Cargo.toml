[package]
name = "release"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dd-agent"
path = "src/bin/dd-agent.rs"

[dependencies]
sha2 = "0.10"
identity = { path = "../../client/identity" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
# the agent fetches one small file; nothing async, nothing heavy
ureq = { version = "3", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive", "env"] }
