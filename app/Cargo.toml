[package]
name = "commonty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Commonty app: a member's device, their libraries, their boxes"

[lib]
name = "commonty_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "commonty"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auth = { path = "../client/auth" }
identity = { path = "../client/identity" }
directory = { path = "../client/directory" }
account = { path = "../client/account" }
media = { path = "../client/media" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync"] }
